name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Tiêu đề bản phát hành'
        required: false
        default: 'Bản phát hành mới'

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew

      - name: Xây dựng Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Kiểm tra file APK đã tạo
        run: |
          ls -la app/build/outputs/apk/release/
          # Đảm bảo file Lịch Âm Việt.apk tồn tại
          if [ -f "app/build/outputs/apk/release/Lịch Âm Việt.apk" ]; then
            echo "Found named release APK: Lịch Âm Việt.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Lịch Âm Việt.apk"
          fi

      - name: Lưu trữ APK làm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lich-Am-Viet-APK
          path: app/build/outputs/apk/release/Lịch Âm Việt.apk

      - name: Tạo GitHub Release & Tải APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: app/build/outputs/apk/release/Lịch Âm Việt.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
