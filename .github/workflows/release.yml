name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Tiêu đề bản phát hành'
        required: false
        default: 'Bản phát hành mới'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Chấp nhận bản quyền Android SDK & tải SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-36" || true

      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x gradlew

      - name: Xây dựng Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Chuẩn bị file APK phát hành
        run: |
          ls -la app/build/outputs/apk/release/
          cp "app/build/outputs/apk/release/app-release.apk" "Lich-Am-Viet.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "Lịch Âm Việt.apk"

      - name: Lưu trữ APK làm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lich-Am-Viet-APK
          path: Lich-Am-Viet.apk

      - name: Tạo GitHub Release & Tải APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: |
            Lich-Am-Viet.apk
            Lịch Âm Việt.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
